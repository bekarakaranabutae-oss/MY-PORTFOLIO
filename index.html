<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOD MODE | KEVIN TAAKE 🇰🇮</title>

<style>
body {
    margin: 0;
    color: #00ff00;
    font-family: monospace;
    overflow-x: hidden;

    /* ✅ NEW BACKGROUND IMAGE ADDED */
    background: url('https://raw.githubusercontent.com/bekarakaranabutae-oss/MY-PORTFOLIO/main/background.png') no-repeat center center fixed;
    background-size: cover;
}

/* BACKGROUND VIDEO */
#bgVideo {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -3;
}

/* OVERLAY */
.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: -2;
}

/* MATRIX */
canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: -1;
}

/* HEADER */
header {
    text-align: center;
    padding: 20px;
    border-bottom: 1px solid #00ff00;
}

/* PROFILE */
.profile {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 2px solid #00ff00;
    box-shadow: 0 0 20px #00ff00;
    object-fit: cover;
    margin-bottom: 10px;
}

/* GRID */
.container {
    display: grid;
    gap: 20px;
    padding: 20px;
    max-width: 1000px;
    margin: auto;
}

/* BOX */
.box {
    border: 1px solid #00ff00;
    padding: 15px;
    border-radius: 10px;
    background: rgba(0,0,0,0.5);
}

/* BUTTONS */
button, select {
    padding: 8px;
    margin: 5px;
    background: #00ff00;
    border: none;
    cursor: pointer;
}

/* INPUT */
input {
    padding: 10px;
    width: 100%;
    background: black;
    border: 1px solid #00ff00;
    color: #00ff00;
    margin-top: 10px;
}

/* IFRAME */
iframe {
    width: 100%;
    height: 300px;
    border: none;
}

/* STATUS */
.status {
    display: flex;
    justify-content: space-between;
}

/* EXTRA PANELS */
.panel-title {
    font-weight: bold;
    margin-bottom: 10px;
}

/* LOG WINDOW */
.log {
    height: 120px;
    overflow-y: auto;
    border: 1px solid #00ff00;
    padding: 10px;
    background: black;
}

/* SETTINGS */
.settings {
    display: flex;
    flex-direction: column;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 20px;
    border-top: 1px solid #00ff00;
    margin-top: 40px;
}

/* EXTRA UI STYLES */
.card {
    border: 1px solid #00ff00;
    padding: 10px;
    margin-top: 10px;
    background: rgba(0,0,0,0.4);
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<!-- VIDEO BACKGROUND -->
<video autoplay muted loop id="bgVideo">
    <source src="https://raw.githubusercontent.com/bekarakaranabutae-oss/MY-PORTFOLIO/main/background.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- MUSIC -->
<audio id="bgMusic" autoplay loop>
    <source src="https://raw.githubusercontent.com/bekarakaranabutae-oss/MY-PORTFOLIO/main/music.mp3" type="audio/mpeg">
</audio>

<canvas id="matrix"></canvas>

<header>
    <img src="https://raw.githubusercontent.com/bekarakaranabutae-oss/KEVIN-HOST-PREMIUM/main/profile.jpg" class="profile">
    <h1>KEVIN TAAKE 🇰🇮</h1>
    <p>⚠ GOD MODE SYSTEM ⚠</p>
    <button onclick="toggleMusic()">🎧 Play / Pause Music</button>
</header>

<div class="container">

<!-- TERMINAL -->
<div class="box">
    <div class="panel-title">🧠 HACKER SCANNER</div>

    <form onsubmit="scanHacker(event)">
        <input type="text" id="hackerInput" placeholder="Type: who is the hacker" required>
        <button type="submit">SCAN</button>
    </form>

    <div id="terminal" class="log"></div>

    <div id="hackerResult" class="card hidden">
        <h2>⚠ TARGET IDENTIFIED ⚠</h2>
        <p><strong>NAME:</strong> KEVIN TAAKE 🇰🇮</p>

        <img src="https://raw.githubusercontent.com/bekarakaranabutae-oss/KEVIN-HOST-PREMIUM/main/profile.jpg"
        style="width:120px; border-radius:50%; border:2px solid #00ff00;">

        <iframe src="https://maps.google.com/maps?q=Kiribati&z=6&output=embed"></iframe>
    </div>
</div>

<!-- STATUS -->
<div class="box status">
    <div id="coords">📍 Lat: -- Lon: --</div>
    <div id="heading">🧭 Heading: --</div>
    <div id="accuracy">📡 Accuracy: --</div>
</div>

<!-- CONTROL -->
<div class="box">
    <div class="panel-title">CONTROL PANEL</div>

    <button onclick="startTracking()">Start Tracking</button>
    <button onclick="stopTracking()">Stop Tracking</button>

    <select onchange="changeRadar(this.value)">
        <option value="radar">Radar</option>
        <option value="rain">Rain</option>
        <option value="satellite">Satellite</option>
    </select>
</div>

<!-- RADAR -->
<div class="box">
    <div class="panel-title">📡 RADAR VIEW</div>
    <iframe id="radarFrame"
        src="https://embed.windy.com/embed2.html?lat=1.33&lon=173.00&zoom=5&overlay=radar">
    </iframe>
</div>

<!-- MAP -->
<div class="box">
    <div class="panel-title">📍 LIVE LOCATION</div>
    <iframe id="map"
        src="https://maps.google.com/maps?q=Kiribati&z=6&output=embed">
    </iframe>
</div>

<!-- EXTRA FEATURE SECTION -->
<div class="box">
    <div class="panel-title">⚙ SYSTEM INFO</div>
    <div class="card">Browser: <span id="browser"></span></div>
    <div class="card">Platform: <span id="platform"></span></div>
    <div class="card">Language: <span id="lang"></span></div>
</div>

<!-- LOG -->
<div class="box">
    <div class="panel-title">📜 SYSTEM LOG</div>
    <div id="systemLog" class="log"></div>
    <button onclick="addLog()">Add Log</button>
</div>

</div>

<footer>
    GOD MODE SYSTEM © KEVIN TAAKE 🇰🇮
</footer>

<script>

/* MUSIC */
const music = document.getElementById("bgMusic");
function toggleMusic(){
    music.paused ? music.play() : music.pause();
}

/* SYSTEM INFO */
document.getElementById("browser").innerText = navigator.userAgent;
document.getElementById("platform").innerText = navigator.platform;
document.getElementById("lang").innerText = navigator.language;

/* MATRIX */
const c = document.getElementById("matrix");
const ctx = c.getContext("2d");
c.height = window.innerHeight;
c.width = window.innerWidth;

const letters = "01GODHACK";
const font = 14;
const columns = c.width/font;
const drops = Array(Math.floor(columns)).fill(1);

function draw(){
    ctx.fillStyle="rgba(0,0,0,0.05)";
    ctx.fillRect(0,0,c.width,c.height);

    ctx.fillStyle="#0f0";
    ctx.font=font+"px monospace";

    drops.forEach((y,i)=>{
        let text = letters[Math.floor(Math.random()*letters.length)];
        ctx.fillText(text,i*font,y*font);

        if(y*font>c.height && Math.random()>0.975) drops[i]=0;
        drops[i]++;
    });
}
setInterval(draw,30);

/* SCANNER */
function scanHacker(e){
    e.preventDefault();
    const input = document.getElementById("hackerInput").value.toLowerCase();
    const terminal = document.getElementById("terminal");
    const result = document.getElementById("hackerResult");

    terminal.innerHTML = "";
    result.classList.add("hidden");

    if(input === "who is the hacker"){
        fakeLoading([
            "Initializing system...",
            "Bypassing firewall...",
            "Accessing database...",
            "Decrypting identity...",
            "MATCH FOUND..."
        ], () => {
            result.classList.remove("hidden");
        });
    } else {
        fakeLoading([
            "Scanning...",
            "No results found",
            "ACCESS DENIED ❌"
        ]);
    }
}

/* LOADING */
function fakeLoading(lines, callback){
    const terminal = document.getElementById("terminal");
    let i = 0;

    function nextLine(){
        if(i < lines.length){
            let line = document.createElement("div");
            terminal.appendChild(line);

            let text = lines[i];
            let j = 0;

            let typing = setInterval(()=>{
                line.innerHTML += text[j];
                j++;

                if(j >= text.length){
                    clearInterval(typing);
                    i++;
                    setTimeout(nextLine, 400);
                }
            }, 25);

        } else {
            if(callback) callback();
        }
    }
    nextLine();
}

/* RADAR */
function changeRadar(type){
    const radar = document.getElementById("radarFrame");

    if(type === "rain"){
        radar.src = "https://embed.windy.com/embed2.html?overlay=rain&lat=1.33&lon=173&zoom=5";
    }
    else if(type === "satellite"){
        radar.src = "https://embed.windy.com/embed2.html?overlay=satellite&lat=1.33&lon=173&zoom=5";
    }
    else {
        radar.src = "https://embed.windy.com/embed2.html?overlay=radar&lat=1.33&lon=173&zoom=5";
    }
}

/* GEOLOCATION */
let watchId;

function startTracking(){
    if(navigator.geolocation){
        watchId = navigator.geolocation.watchPosition(updatePosition);
    }
}

function stopTracking(){
    navigator.geolocation.clearWatch(watchId);
}

function updatePosition(pos){
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    document.getElementById("coords").innerText =
        `📍 Lat: ${lat.toFixed(5)} Lon: ${lon.toFixed(5)}`;

    document.getElementById("map").src =
        `https://maps.google.com/maps?q=${lat},${lon}&z=15&output=embed`;
}

/* LOG */
function addLog(){
    const log = document.getElementById("systemLog");
    const entry = document.createElement("div");
    entry.innerText = "LOG: " + new Date().toLocaleString();
    log.appendChild(entry);
}

</script>

</body>
</html>
